name: Unpack project upload
on:
  push:
    paths: ['medical-champion.tgz']
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract archive into the repository
        run: |
          tar xzf medical-champion.tgz
          git rm -q medical-champion.tgz
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Medical Champion MVP: website, WhatsApp booking, operations portal, companion PWA"
          git push
